# Reusable: generate a Unity activation request (.alf) from inside CI.
#
# Personal licence files go stale. The .ulf carries a timestamp that Unity's licensing
# service validates, and once it stops validating the editor refuses to start with:
#
#   [Licensing::Client] Error: Code 400 ... (status: TimeStamp validation failed)
#   Unclassified error occured while trying to activate license.
#
# The editor then produces no output at all, so the job fails with a bare exit code 1
# and no test results, which looks nothing like a licensing problem from the outside.
#
# Exporting a .ulf from a developer machine also binds it to that machine, and opening
# the editor locally can supersede it. Generating the request here avoids both.
#
# Run it, then:
#   1. Download the "unity-activation-file" artifact and unzip it.
#   2. Upload the .alf at https://license.unity3d.com/manual
#      (Unity Personal, "I don't use Unity in a professional capacity").
#   3. Paste the ENTIRE contents of the .ulf you get back into the UNITY_LICENSE secret.
#
# Expect to repeat this whenever builds start failing with the error above.
name: Unity activation

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Unity project root, used to read the editor version.'
        type: string
        default: '.'
      unity-version:
        description: 'Editor version. Empty = read it from ProjectSettings/ProjectVersion.txt.'
        type: string
        default: ''

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the editor version
        id: version
        shell: bash
        env:
          PROJECT_PATH: ${{ inputs.project-path }}
          VERSION_INPUT: ${{ inputs.unity-version }}
        run: |
          set -euo pipefail
          if [ -n "$VERSION_INPUT" ]; then
            version="$VERSION_INPUT"
          else
            file="$PROJECT_PATH/ProjectSettings/ProjectVersion.txt"
            if [ ! -f "$file" ]; then
              echo "::error::$file not found. Pass unity-version instead."
              exit 1
            fi
            version="$(sed -n 's/^m_EditorVersion: *//p' "$file" | tr -d '\r')"
          fi
          echo "unity-version=$version" >> "$GITHUB_OUTPUT"
          echo "Requesting activation for Unity $version"

      - uses: game-ci/unity-request-activation-file@v2
        id: activation
        with:
          unityVersion: ${{ steps.version.outputs.unity-version }}

      - uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: ${{ steps.activation.outputs.filePath }}
          retention-days: 1
          if-no-files-found: error

      - name: What to do next
        shell: bash
        run: |
          {
            echo "### Unity activation"
            echo
            echo "1. Download the **unity-activation-file** artifact from this run and unzip it."
            echo "2. Upload the \`.alf\` at <https://license.unity3d.com/manual>."
            echo "3. Paste the entire \`.ulf\` you get back into the \`UNITY_LICENSE\` secret."
            echo
            echo "The artifact expires in 1 day; an activation file is single use."
          } >> "$GITHUB_STEP_SUMMARY"
