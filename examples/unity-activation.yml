# Example caller. Copy into a game repo as .github/workflows/unity-activation.yml.
#
# Run it from Actions when builds start failing with "TimeStamp validation failed",
# then follow the run summary to refresh the UNITY_LICENSE secret.
name: Unity activation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    uses: TheFriedHashbrown/unity-game-ci/.github/workflows/unity-activation.yml@v1
